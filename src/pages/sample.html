<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="./js/vendor/splide@4.1.4/splide.min.css" />
    <link rel="stylesheet" href="./css/style.css" />

    <title>Frontend Mentor | Room homepage</title>

    <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
    <style>
      .attribution {
        font-size: 0.6875rem;
        text-align: center;
      }
      .attribution a {
        color: hsl(228, 45%, 44%);
      }
    </style>
  </head>
  <body>
    <section
      class="splide"
      id="hero-slider"
      aria-label="Featured rooms"
    >
      <div class="splide__track">
        <ul class="splide__list">
          <li class="splide__slide">
            <picture>
              <source
                srcset="./images/desktop-image-hero-1.jpg"
                media="(min-width: 64em)"
              />
              <img src="./images/mobile-image-hero-1.jpg" alt="" />
            </picture>
          </li>
          <li class="splide__slide">
            <picture>
              <source
                srcset="./images/desktop-image-hero-2.jpg"
                media="(min-width: 64em)"
              />
              <img src="./images/mobile-image-hero-2.jpg" alt="" />
            </picture>
          </li>
          <li class="splide__slide">
            <picture>
              <source
                srcset="./images/desktop-image-hero-3.jpg"
                media="(min-width: 64em)"
              />
              <img src="./images/mobile-image-hero-3.jpg" alt="" />
            </picture>
          </li>
        </ul>
      </div>
      <!-- 사용자 정의 화살표 영역 -->
      <div class="splide__arrows c-splide__arrows l-cluster">
        <button
          type="button"
          class="c-splide__arrow c-splide__arrow--prev"
          id="custom-prev"
          aria-label="Previous slide"
          aria-controls="hero-slider-track"
        >
          <svg
            width="14"
            height="24"
            viewBox="0 0 14 24"
            xmlns="http://www.w3.org/2000/svg"
            aria-hidden="true"
            focusable="false"
          >
            <path
              d="M13 0L1 12l12 12"
              stroke="#FFF"
              fill="none"
              fill-rule="evenodd"
            />
          </svg>
        </button>
        <button
          type="button"
          class="c-splide__arrow c-splide__arrow--next"
          id="custom-next"
          aria-label="Next slide"
          aria-controls="hero-slider-track"
        >
          <svg
            width="14"
            height="24"
            viewBox="0 0 14 24"
            xmlns="http://www.w3.org/2000/svg"
            aria-hidden="true"
            focusable="false"
          >
            <path
              d="M1 0l12 12L1 24"
              stroke="#FFF"
              fill="none"
              fill-rule="evenodd"
            />
          </svg>
        </button>
      </div>
    </section>
    <script src="./js/vendor/splide@4.1.4/splide.min.js"></script>
    <script type="module" src="./js/main.js"></script>
  </body>
</html>
