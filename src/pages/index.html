<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./js/vendor/splide@4.1.4/splide.min.css" />
    <link rel="stylesheet" href="./css/style.css" />

    <title>Frontend Mentor | Room homepage</title>
  </head>
  <!-- 접근성 수정: Home 링크가 실제 문서 최상단으로 이동하도록 목적지를 제공한다. -->
  <body id="home">
    <a class="c-skip-link" href="#main">Skip to main content</a>
    <header class="c-header l-cluster" id="banner-header" data-nav-panel-root>
      <button
        type="button"
        class="c-nav-panel-toggle"
        data-nav-open
        aria-expanded="false"
        aria-controls="mainNav"
      >
        <svg
          width="24"
          height="16"
          viewBox="0 0 24 16"
          class="c-header__hamburger-icon"
          aria-hidden="true"
          xmlns="http://www.w3.org/2000/svg"
        >
          <g fill="currentColor" fill-rule="evenodd">
            <path d="M0 0h24v2H0zM0 7h24v2H0zM0 14h24v2H0z" />
          </g>
        </svg>
        <span class="u-sr-only">Open menu</span>
      </button>
      <!-- <img width="62" height="14" class="c-header__logo" src="./images/logo.svg" alt="" /> -->
      <!-- 접근성 수정: CSS 마스크 로고의 브랜드명을 보조 기술에도 제공한다. -->
      <span class="c-header__logo" role="img" aria-label="room"></span>
      <nav class="c-nav-panel" id="mainNav" aria-label="Main" data-nav-panel>
        <div class="c-nav-panel__inner l-cluster">
          <button
            type="button"
            class="c-nav-panel__close"
            data-nav-close
            aria-label="Close menu"
          >
            <svg
              width="16"
              height="16"
              viewBox="0 0 16 16"
              class="c-nav-panel__close"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                d="M14.364.222l1.414 1.414L9.414 8l6.364 6.364-1.414 1.414L8 9.414l-6.364 6.364-1.414-1.414L6.586 8 .222 1.636 1.636.222 8 6.586 14.364.222z"
                fill="#000"
                fill-rule="evenodd"
                opacity=".201"
              />
            </svg>
          </button>
          <ul class="c-nav-panel__links l-cluster">
            <li class="c-nav-panel__item">
              <a class="c-nav-panel__link" href="/index.html#home">Home</a>
            </li>
            <li class="c-nav-panel__item">
              <a class="c-nav-panel__link" href="/index.html#shop">Shop</a>
            </li>
            <li class="c-nav-panel__item">
              <a class="c-nav-panel__link" href="/index.html#about">About</a>
            </li>
            <li class="c-nav-panel__item">
              <a class="c-nav-panel__link" href="/index.html#contact"
                >Contact</a
              >
            </li>
          </ul>
        </div>
      </nav>
    </header>
    <main class="c-main" id="main">
      <!-- Section slide -->
      @@include('./components/splide.html')
      <div class="splide__arrows c-splide__arrows l-cluster">
        <button
          type="button"
          class="c-splide__arrow c-splide__arrow--prev"
          id="custom-prev"
          aria-label="Previous slide"
          aria-controls="hero-slider-track"
        >
          <svg
            width="14"
            height="24"
            class="c-splide__arrow-icon"
            viewBox="0 0 14 24"
            xmlns="http://www.w3.org/2000/svg"
            aria-hidden="true"
            focusable="false"
          >
            <path
              d="M13 0L1 12l12 12"
              stroke="#FFF"
              fill="none"
              fill-rule="evenodd"
            />
          </svg>
        </button>
        <button
          type="button"
          class="c-splide__arrow c-splide__arrow--next"
          id="custom-next"
          aria-label="Next slide"
          aria-controls="hero-slider-track"
        >
          <svg
            width="14"
            height="24"
            class="c-splide__arrow-icon"
            viewBox="0 0 14 24"
            xmlns="http://www.w3.org/2000/svg"
            aria-hidden="true"
            focusable="false"
          >
            <path
              d="M1 0l12 12L1 24"
              stroke="#FFF"
              fill="none"
              fill-rule="evenodd"
            />
          </svg>
        </button>
      </div>
      <!-- Section shop -->
      @@include('./components/shop.html')
      <!-- Section About -->
      @@include('./components/about.html')
    </main>
    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by
      <a href="https://www.frontendmentor.io/profile/jonghwascript"
        >jonghwascript</a
      >.
    </footer>
  </body>
  <script src="./js/vendor/splide@4.1.4/splide.min.js"></script>
  <script type="module" src="./js/main.js"></script>
</html>
