<header class="c-header l-cluster" id="banner-header" data-nav-panel-root>
  <button
    type="button"
    class="c-nav-panel-toggle"
    data-nav-open
    aria-expanded="false"
    aria-controls="mainNav"
  >
    <svg
      width="24"
      height="16"
      viewBox="0 0 24 16"
      class="c-header__hamburger-icon"
      aria-hidden="true"
      xmlns="http://www.w3.org/2000/svg"
    >
      <g fill="currentColor" fill-rule="evenodd">
        <path d="M0 0h24v2H0zM0 7h24v2H0zM0 14h24v2H0z" />
      </g>
    </svg>
    <span class="u-sr-only">Open menu</span>
  </button>
  <!-- 접근성 수정: CSS 마스크 로고의 브랜드명을 보조 기술에도 제공한다. -->
  <span class="c-header__logo" role="img" aria-label="room"></span>
  <nav class="c-nav-panel" id="mainNav" aria-label="Main" data-nav-panel>
    <div class="c-nav-panel__inner l-cluster">
      <button
        type="button"
        class="c-nav-panel__close"
        data-nav-close
        aria-label="Close menu"
      >
        <svg
          width="16"
          height="16"
          viewBox="0 0 16 16"
          class="c-nav-panel__close"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            d="M14.364.222l1.414 1.414L9.414 8l6.364 6.364-1.414 1.414L8 9.414l-6.364 6.364-1.414-1.414L6.586 8 .222 1.636 1.636.222 8 6.586 14.364.222z"
            fill="#000"
            fill-rule="evenodd"
            opacity=".201"
          />
        </svg>
      </button>
      <ul class="c-nav-panel__links l-cluster">
        <li class="c-nav-panel__item">
          <a class="c-nav-panel__link" href="/index.html#home">Home</a>
        </li>
        <li class="c-nav-panel__item">
          <a class="c-nav-panel__link" href="/index.html#shop">Shop</a>
        </li>
        <li class="c-nav-panel__item">
          <a class="c-nav-panel__link" href="/index.html#about">About</a>
        </li>
        <li class="c-nav-panel__item">
          <a class="c-nav-panel__link" href="/index.html#contact">Contact</a>
        </li>
      </ul>
    </div>
  </nav>
</header>
