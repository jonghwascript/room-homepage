<div class="splide__arrows c-splide__arrows l-cluster">
  <button
    type="button"
    class="c-splide__arrow c-splide__arrow--prev"
    id="custom-prev"
    aria-label="Previous slide"
    aria-controls="hero-slider-track"
  >
    <svg
      width="14"
      height="24"
      class="c-splide__arrow-icon"
      viewBox="0 0 14 24"
      xmlns="http://www.w3.org/2000/svg"
      aria-hidden="true"
      focusable="false"
    >
      <path
        d="M13 0L1 12l12 12"
        stroke="#FFF"
        fill="none"
        fill-rule="evenodd"
      />
    </svg>
  </button>
  <button
    type="button"
    class="c-splide__arrow c-splide__arrow--next"
    id="custom-next"
    aria-label="Next slide"
    aria-controls="hero-slider-track"
  >
    <svg
      width="14"
      height="24"
      class="c-splide__arrow-icon"
      viewBox="0 0 14 24"
      xmlns="http://www.w3.org/2000/svg"
      aria-hidden="true"
      focusable="false"
    >
      <path d="M1 0l12 12L1 24" stroke="#FFF" fill="none" fill-rule="evenodd" />
    </svg>
  </button>
</div>
